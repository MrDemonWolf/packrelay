name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          PLUGIN_VERSION=$(grep -m1 "^ \* Version:" packrelay.php | tr -d ' ' | cut -d: -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — plugin header: $PLUGIN_VERSION, tag: $TAG_VERSION"
            exit 1
          fi
          echo "Version OK: $PLUGIN_VERSION"

  test:
    name: PHP ${{ matrix.php }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  build:
    name: Build & Attach ZIP
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: Build ZIP
        run: |
          mkdir -p build/packrelay
          rsync -av --exclude-from=.distignore . build/packrelay/
          cd build && zip -r packrelay.zip packrelay/
          rm -rf packrelay

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/packrelay.zip
